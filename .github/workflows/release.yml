name: Build Zip Formula SimHub Installer

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-installer:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate dashboard package
        shell: pwsh
        run: |
          $dashboards = @(Get-ChildItem "dashboard" -Filter "*.simhubdash" -File -ErrorAction SilentlyContinue)
          if ($dashboards.Count -eq 0) {
            throw "No .simhubdash file found in dashboard/. Add the dashboard before creating a release."
          }
          if ($dashboards.Count -gt 1) {
            throw "Multiple .simhubdash files found. Keep exactly one dashboard for this installer."
          }
          if (-not (Test-Path "installer/ZipFormula.iss")) {
            throw "installer/ZipFormula.iss is missing."
          }

      - name: Download pinned PostItNoteRacing plugin
        shell: pwsh
        run: |
          $version = "v1.0.7.8"
          $release = Invoke-RestMethod -Uri "https://api.github.com/repos/derrickmoeller/PostItNoteRacing/releases/tags/$version" -Headers @{ "User-Agent" = "ZipFormula-SimHub-Installer" }
          New-Item -ItemType Directory -Force -Path "build/plugin", "build/output" | Out-Null
          $assets = @("PostItNoteRacing.Plugin.dll", "Post-It-Note-Racing_extensions.js")
          foreach ($assetName in $assets) {
            $asset = @($release.assets | Where-Object { $_.name -eq $assetName }) | Select-Object -First 1
            if (-not $asset) { throw "Asset not found: $assetName" }
            Invoke-WebRequest -Uri $asset.browser_download_url -OutFile ("build/plugin/" + $assetName)
            if ((Get-Item ("build/plugin/" + $assetName)).Length -le 0) { throw "Downloaded asset is empty: $assetName" }
          }

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --yes --no-progress

      - name: Build installer
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}"
          if ($version -eq "main" -or [string]::IsNullOrWhiteSpace($version)) { $version = "0.1.0-dev" }
          $version = $version.TrimStart("v")
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=$version" "installer/ZipFormula.iss"
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup compilation failed." }

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: build/output/ZipFormula-SimHub-Setup.exe
          generate_release_notes: true

      - name: Upload installer artifact
        if: startsWith(github.ref, 'refs/heads/')
        uses: actions/upload-artifact@v4
        with:
          name: ZipFormula-SimHub-Setup
          path: build/output/ZipFormula-SimHub-Setup.exe
          if-no-files-found: error
